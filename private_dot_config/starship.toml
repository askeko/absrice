add_newline = false
format = "\n$username$hostname$kubernetes$vcsh$git_branch$git_commit$git_state$git_metrics$git_status$hg_branch$docker_context$package$cmake$dart$deno$direnv$dotnet$elixir$elm$erlang$golang$helm$java$julia$kotlin$nim$nodejs$ocaml$perl$php$purescript$python$red$ruby$rust$scala$swift$terraform$vlang$vagrant$zig$nix_shell$conda$memory_usage$aws$gcloud$openstack$env_var$crystal$cmd_duration$lua$jobs$battery\n$directory\n$status[ $shell](bold)$shlvl$character"

[aws]
symbol = " "

[conda]
symbol = " "

[dart]
symbol = " "

[directory]
format = "[ : $path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"
truncate_to_repo = false
truncation_length = 0

[direnv]
disabled = false

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[fill]
style = "bold"
symbol = "─"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "

[golang]
symbol = " "

[hg_branch]
symbol = " "

[java]
symbol = " "

[julia]
symbol = " "

[memory_usage]
symbol = "󰍛 "

[nim]
symbol = " "

[nix_shell]
format = "via [$symbol$state]($style) "
symbol = " "

[package]
symbol = "󰏗 "

[perl]
symbol = " "

[php]
symbol = " "

[python]
symbol = " "

[ruby]
symbol = " "

[rust]
symbol = " "

[scala]
symbol = " "

[shell]
disabled = false

[shlvl]
disabled = false
style = "bold red"
symbol = ""
threshold = 2

[status]
disabled = false
symbol = " "

[swift]
symbol = " "

[username]
format = "[  $user]($style) "
show_always = true
