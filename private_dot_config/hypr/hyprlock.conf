# Lock screen: the current wallpaper, blurred, with a password field and the
# time and date. Locked by Mod+Alt+L, the power menu and hypridle.

source = ~/.config/hypr/hyprlock-theme.conf

background {
    monitor =
    # Kept pointing at the live wallpaper by wallpaper-set/wallpaper-restore.
    path = ~/.local/state/theme/current-wallpaper
    blur_passes = 2
    blur_size = 6
    brightness = 0.8
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3

    inner_color = $bg
    outer_color = $blue
    font_color = $fg
    check_color = $green
    fail_color = $red
    capslock_color = $yellow

    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = false
    dots_rounding = -1
    fade_on_empty = false
    placeholder_text = <i>Input Password...</i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    rounding = -1

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 110
    position = 650, -300
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] date +"%a, %d. %b %Y"
    color = $fg
    font_size = 60
    position = 550, -400
    halign = center
    valign = center
}
